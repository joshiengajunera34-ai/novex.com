<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NØV3X CODM</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #241044 0%, #0b0612 45%, #030305 100%);
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 25px 10px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 6px;
      text-shadow: 0 0 20px #8d38c4;
    }

    .subtitle {
      margin-top: 8px;
      color: #bda6ce;
      letter-spacing: 3px;
      font-size: 13px;
    }

    .welcome {
      margin-top: 20px;
      padding: 20px;
      border: 1px solid #54277a;
      border-radius: 16px;
      background: rgba(15, 9, 24, 0.9);
    }

    .welcome h2 {
      margin-bottom: 8px;
    }

    #username {
      color: #c56cff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      padding: 22px 15px;
      background: rgba(13, 8, 21, 0.95);
      border: 1px solid #42205e;
      border-radius: 15px;
      color: white;
      text-decoration: none;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: #9c43d2;
      box-shadow: 0 0 20px rgba(156, 67, 210, 0.25);
    }

    .icon {
      font-size: 27px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: bold;
    }

    .card-text {
      color: #9d8ba9;
      font-size: 12px;
      margin-top: 5px;
    }

    .download {
      display: block;
      margin-top: 18px;
      padding: 17px;

      text-align: center;
      text-decoration: none;

      color: white;
      font-size: 16px;
      font-weight: 900;
      letter-spacing: 1px;

      background: linear-gradient(90deg, #7025a8, #a43dd8);

      border: 1px solid #c064ef;
      border-radius: 13px;

      box-shadow:
        0 0 20px rgba(153, 55, 215, 0.3);

      transition: 0.2s;
    }

    .download:hover {
      transform: translateY(-2px);
      box-shadow:
        0 0 30px rgba(153, 55, 215, 0.5);
    }

    .section {
      margin-top: 25px;
    }

    .section-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .announcement {
      padding: 18px;
      background: rgba(13, 8, 21, 0.95);
      border: 1px solid #42205e;
      border-radius: 15px;
      color: #d8c9df;
    }

    .logout {
      width: 100%;
      margin-top: 20px;
      padding: 14px;

      background: transparent;
      color: #ff7777;

      border: 1px solid #713535;
      border-radius: 12px;

      font-weight: bold;
      cursor: pointer;
    }

    .logout:hover {
      background: rgba(150, 40, 40, 0.15);
    }

    #adminCard {
      display: none;
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="logo">NØV3X</div>
    <div class="subtitle">CODM COMMUNITY</div>
  </div>


  <div class="welcome">
    <h2>
      Welcome, <span id="username">Player</span>
    </h2>

    <p>
      ONE SQUAD, ONE FATE.
    </p>
  </div>


  <!-- DOWNLOAD APK -->

  <a
    class="download"
    href="YOUR_APK_LINK_HERE"
    target="_blank"
    rel="noopener"
  >
    ⬇ DOWNLOAD NØV3X APK
  </a>


  <!-- MAIN MENU -->

  <div class="grid">

    <a class="card" href="scrimmage.html">
      <div class="icon">🎮</div>
      <div class="card-title">SCRIMMAGE</div>
      <div class="card-text">
        Mine System & Slots
      </div>
    </a>


    <a class="card" href="leaderboard.html">
      <div class="icon">🏆</div>
      <div class="card-title">LEADERBOARD</div>
      <div class="card-text">
        Team Rankings
      </div>
    </a>


    <a class="card" href="teams.html">
      <div class="icon">👥</div>
      <div class="card-title">TEAMS</div>
      <div class="card-text">
        NØV3X Teams
      </div>
    </a>


    <a class="card" href="chat.html">
      <div class="icon">💬</div>
      <div class="card-title">COMMUNITY CHAT</div>
      <div class="card-text">
        Chat with members
      </div>
    </a>


    <a
      class="card"
      id="adminCard"
      href="admin.html"
    >
      <div class="icon">⚙️</div>
      <div class="card-title">ADMIN PANEL</div>
      <div class="card-text">
        Control Center
      </div>
    </a>

  </div>


  <!-- ANNOUNCEMENTS -->

  <div class="section">

    <div class="section-title">
      📢 ANNOUNCEMENTS
    </div>

    <div
      class="announcement"
      id="announcements"
    >
      Loading announcements...
    </div>

  </div>


  <button class="logout" id="logoutButton">
    LOGOUT
  </button>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

const usernameElement =
  document.getElementById("username");

const adminCard =
  document.getElementById("adminCard");

const announcements =
  document.getElementById("announcements");


// ==========================
// AUTH
// ==========================

auth.onAuthStateChanged(async (user) => {

  if (!user) {

    window.location.href = "login.html";

    return;
  }


  try {

    const userDoc =
      await db
        .collection("users")
        .doc(user.uid)
        .get();


    if (userDoc.exists) {

      const data =
        userDoc.data();


      usernameElement.textContent =
        data.username || "Player";


      if (data.role === "admin") {

        adminCard.style.display =
          "block";
      }
    }


  } catch (error) {

    console.error(
      "User profile error:",
      error
    );

  }

});


// ==========================
// ANNOUNCEMENTS
// ==========================

db.collection("announcements")
  .orderBy("createdAt", "desc")
  .limit(5)
  .onSnapshot(

    (snapshot) => {

      if (snapshot.empty) {

        announcements.textContent =
          "No announcements yet.";

        return;
      }


      announcements.innerHTML = "";


      snapshot.forEach((doc) => {

        const data =
          doc.data();


        const item =
          document.createElement("div");


        item.style.marginBottom =
          "12px";


        item.innerHTML = `
          <strong>
            ${data.title || "Announcement"}
          </strong>

          <br>

          <span style="color:#a994b5;">
            ${data.message || ""}
          </span>
        `;


        announcements.appendChild(item);

      });

    },

    (error) => {

      console.error(error);

      announcements.textContent =
        "Unable to load announcements.";
    }

  );


// ==========================
// LOGOUT
// ==========================

document
  .getElementById("logoutButton")
  .onclick = async () => {

    try {

      await auth.signOut();

      window.location.href =
        "login.html";

    } catch (error) {

      console.error(error);

    }

  };

</script>

</body>
</html>
