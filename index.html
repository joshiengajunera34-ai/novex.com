<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NOVEX CODM</title>

<meta name="theme-color" content="#8b2cff">
<link rel="manifest" href="./manifest.json">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top,#3b1264 0%,#14051f 35%,#050208 80%);
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  padding:15px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
}

/* HEADER */

header{
  text-align:center;
  padding:25px 15px;
  border:1px solid #8b2cff;
  border-radius:20px;
  background:rgba(15,3,25,.9);
  box-shadow:
    0 0 25px rgba(139,44,255,.35),
    inset 0 0 25px rgba(139,44,255,.08);
}

.logo{
  font-size:45px;
  font-weight:1000;
  letter-spacing:8px;
  color:#d99aff;
  text-shadow:
    0 0 10px #8b2cff,
    0 0 25px #8b2cff,
    0 0 45px #8b2cff;
}

.subtitle{
  margin-top:6px;
  color:#c9a7df;
  font-size:13px;
  letter-spacing:3px;
}

.status{
  display:inline-block;
  margin-top:15px;
  padding:7px 15px;
  border-radius:20px;
  background:#241036;
  border:1px solid #9b3cff;
  color:#ddaaff;
  font-size:11px;
  font-weight:bold;
}

/* TIMER */

.timer-box{
  margin-top:15px;
  padding:20px;
  text-align:center;
  border-radius:18px;
  background:rgba(15,3,25,.9);
  border:1px solid #6323a0;
}

.timer-label{
  color:#a982bd;
  font-size:11px;
  letter-spacing:2px;
}

#timer{
  margin-top:5px;
  font-size:38px;
  font-weight:1000;
  color:#dca0ff;
  text-shadow:0 0 15px #8b2cff;
}

#timerText{
  margin-top:5px;
  color:#9674a8;
  font-size:11px;
}

/* ANNOUNCEMENT */

.announcement{
  margin-top:15px;
  padding:14px;
  border-radius:14px;
  background:rgba(50,12,75,.7);
  border:1px solid #6323a0;
  text-align:center;
  color:#dfb8f5;
}

/* BUTTONS */

button{
  border:none;
  cursor:pointer;
  color:white;
  font-weight:900;
  border-radius:11px;
}

.chat-btn,
.final-btn,
.install-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  background:linear-gradient(135deg,#6d24ad,#b72cff);
  box-shadow:0 0 15px rgba(160,50,255,.3);
}

.chat-btn:hover,
.final-btn:hover,
.install-btn:hover{
  box-shadow:0 0 25px rgba(180,50,255,.7);
  transform:translateY(-1px);
}

/* REGISTRATION */

.card{
  margin-top:15px;
  padding:18px;
  border-radius:18px;
  background:rgba(12,3,20,.92);
  border:1px solid #5d2290;
}

.card-title{
  text-align:center;
  font-size:21px;
  font-weight:1000;
  color:#d996ff;
  margin-bottom:15px;
}

label{
  display:block;
  margin-top:11px;
  margin-bottom:5px;
  color:#b995c7;
  font-size:12px;
}

input,
select{
  width:100%;
  padding:13px;
  border-radius:10px;
  border:1px solid #522076;
  outline:none;
  background:#100719;
  color:white;
}

input:focus,
select:focus{
  border-color:#a12fff;
  box-shadow:0 0 10px rgba(161,47,255,.3);
}

.register-btn{
  width:100%;
  margin-top:16px;
  padding:14px;
  background:linear-gradient(135deg,#7929c7,#c12cff);
}

/* SLOTS */

.slot-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.slot{
  min-height:75px;
  padding:10px;
  border-radius:12px;
  border:1px solid #492061;
  background:rgba(24,7,34,.9);
}

.slot-number{
  color:#9c6ab5;
  font-size:10px;
}

.slot-name{
  margin-top:5px;
  font-size:14px;
  font-weight:900;
  word-break:break-word;
}

.slot-handler{
  margin-top:3px;
  color:#9674a8;
  font-size:10px;
}

.empty-slot{
  color:#5e426a;
  font-size:12px;
  margin-top:8px;
}

.slot-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.remove-btn{
  background:linear-gradient(135deg,#8b1e68,#d8329d);
  padding:8px 10px;
  font-size:10px;
  flex-shrink:0;
}

.remove-btn:hover{
  box-shadow:0 0 15px rgba(216,50,157,.5);
}

/* ACTIVITY */

.activity{
  max-height:250px;
  overflow-y:auto;
}

.activity-item{
  padding:9px;
  margin-bottom:6px;
  border-radius:8px;
  background:#12071a;
  border-left:3px solid #8b2cff;
  font-size:12px;
}

.activity-time{
  color:#795e87;
  font-size:9px;
  margin-top:3px;
}

/* ADMIN */

.admin-panel{
  display:none;
}

.admin-panel.show{
  display:block;
}

.admin-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.admin-grid button{
  padding:12px;
  background:#25102f;
  border:1px solid #65318b;
}

.danger{
  background:#50122d !important;
  border-color:#b52d69 !important;
}

.logout{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:#3b172e;
}

.login-btn{
  width:100%;
  margin-top:10px;
  padding:12px;
  background:#5f25a0;
}

.small{
  color:#866c91;
  font-size:10px;
  margin-top:6px;
}

footer{
  text-align:center;
  padding:20px 0 10px;
  color:#654e70;
  font-size:10px;
}

/* MOBILE */

@media(max-width:500px){

  body{
    padding:10px;
  }

  .logo{
    font-size:35px;
    letter-spacing:5px;
  }

  #timer{
    font-size:32px;
  }

  .slot-grid{
    grid-template-columns:1fr;
  }

  .admin-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header>

  <div class="logo">NOVEX</div>

  <div class="subtitle">
    CODM BR SCRIMMAGE
  </div>

  <div class="status" id="statusBadge">
    LOADING...
  </div>

</header>


<!-- TIMER -->

<div class="timer-box">

  <div class="timer-label">
    SCRIM TIMER
  </div>

  <div id="timer">
    --:--
  </div>

  <div id="timerText">
    SET BY ADMIN
  </div>

</div>


<!-- ANNOUNCEMENT -->

<div class="announcement" id="announcement">
  NOVEX CODM SCRIMMAGE
</div>


<!-- MAIN BUTTONS -->

<button
  class="final-btn"
  onclick="location.href='participants.html'">

  📋 FINAL PARTICIPANTS

</button>


<button
  class="chat-btn"
  onclick="location.href='chat.html'">

  💬 OPEN NOVEX CHAT

</button>


<button
  id="installBtn"
  class="install-btn"
  style="display:none">

  📱 INSTALL NOVEX APP

</button>


<!-- REGISTRATION -->

<div class="card">

  <div class="card-title">
    🎮 REGISTER YOUR TEAM
  </div>

  <label>Team Name</label>

  <input
    id="teamName"
    type="text"
    maxlength="40"
    placeholder="Example: NV3 MAIN">


  <label>Team Handler</label>

  <input
    id="teamHandler"
    type="text"
    maxlength="40"
    placeholder="Example: @handler">


  <label>Discord / Contact</label>

  <input
    id="discord"
    type="text"
    maxlength="60"
    placeholder="Discord username">


  <label>Team Logo URL</label>

  <input
    id="logo"
    type="text"
    maxlength="500"
    placeholder="https://...">


  <label>Select Slot</label>

  <select id="slotSelect">

    <option value="">
      Select an available slot
    </option>

  </select>


  <button
    class="register-btn"
    id="registerBtn">

    🔥 CLAIM SLOT

  </button>

</div>


<!-- SLOTS -->

<div class="card">

  <div class="card-title">
    📋 NOVEX SCRIM SLOTS
  </div>

  <div
    id="slots"
    class="slot-grid">

  </div>

</div>


<!-- ACTIVITY -->

<div class="card">

  <div class="card-title">
    ⚡ LIVE ACTIVITY
  </div>

  <div
    id="activity"
    class="activity">

    Loading...

  </div>

</div>


<!-- ADMIN LOGIN -->

<div class="card">

  <div class="card-title">
    🔐 ADMIN
  </div>

  <input
    id="adminEmail"
    type="email"
    placeholder="Admin email">

  <input
    id="adminPassword"
    type="password"
    placeholder="Admin password"
    style="margin-top:8px">

  <button
    class="login-btn"
    id="loginBtn">

    ADMIN LOGIN

  </button>

  <div
    class="small"
    id="loginMessage">

  </div>

</div>


<!-- ADMIN PANEL -->

<div
  id="adminPanel"
  class="card admin-panel">

  <div class="card-title">
    ⚙️ NOVEX ADMIN PANEL
  </div>


  <div class="admin-grid">

    <button id="openMining">
      🔓 UNLOCK SLOTS
    </button>

    <button id="lockMining">
      🔒 LOCK SLOTS
    </button>

    <button id="setOpen">
      🟢 OPEN
    </button>

    <button id="setRoom">
      🟡 ROOM
    </button>

    <button id="setLive">
      🔴 LIVE
    </button>

    <button id="setEnded">
      ⚫ ENDED
    </button>

  </div>


  <label>
    Announcement
  </label>

  <input
    id="adminAnnouncement"
    maxlength="500"
    placeholder="Write announcement...">

  <button
    id="saveAnnouncement"
    class="login-btn">

    📢 SAVE ANNOUNCEMENT

  </button>


  <label>
    Timer Seconds
  </label>

  <input
    id="timerInput"
    type="number"
    placeholder="Example: 600">


  <button
    id="startTimer"
    class="login-btn">

    ⏱️ START TIMER

  </button>


  <button
    id="stopTimer"
    class="danger"
    style="width:100%;padding:12px;margin-top:8px">

    ⏹ STOP TIMER

  </button>


  <button
    onclick="location.href='score-manager.html'"
    class="login-btn">

    🏆 SCORE MANAGER

  </button>


  <button
    id="clearSlots"
    class="danger"
    style="width:100%;padding:12px;margin-top:8px">

    🗑️ CLEAR ALL SLOTS

  </button>


  <button
    id="logoutBtn"
    class="logout">

    LOGOUT

  </button>

</div>


<footer>
  NOVEX CODM • ONE SQUAD, ONE FATE
</footer>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  remove,
  push
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:"AIzaSyD7v0EFMI85NJk8fUCA7BsReGlVoU8WICY",

  authDomain:"novex-codm.firebaseapp.com",

  databaseURL:
  "https://novex-codm-default-rtdb.firebaseio.com",

  projectId:"novex-codm",

  storageBucket:
  "novex-codm.firebasestorage.app",

  messagingSenderId:
  "422875706154",

  appId:
  "1:422875706154:web:3f21e037173f8b51ba2453",

  measurementId:
  "G-9Z50JE2GFW"
};


const ADMIN_UID =
"MGHp1mPC8LUAtqM73gw9GBXseyE2";


const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);


/* ELEMENTS */

const teamName =
document.getElementById("teamName");

const teamHandler =
document.getElementById("teamHandler");

const discord =
document.getElementById("discord");

const logo =
document.getElementById("logo");

const slotSelect =
document.getElementById("slotSelect");

const registerBtn =
document.getElementById("registerBtn");

const slotsDiv =
document.getElementById("slots");

const activityDiv =
document.getElementById("activity");

const statusBadge =
document.getElementById("statusBadge");

const announcement =
document.getElementById("announcement");

const adminPanel =
document.getElementById("adminPanel");

const loginMessage =
document.getElementById("loginMessage");

const timer =
document.getElementById("timer");


let currentUser = null;
let isAdmin = false;


/* AUTH */

signInAnonymously(auth);


/* AUTH STATE */

onAuthStateChanged(auth, user => {

  currentUser = user;

  if(!user){
    return;
  }

  isAdmin =
    user.uid === ADMIN_UID;

  if(isAdmin){

    adminPanel.classList.add("show");

  }else{

    adminPanel.classList.remove("show");

  }

  startListeners();

});


/* LISTENERS */

function startListeners(){

  onValue(
    ref(db,"novex/slots"),
    snapshot => {

      renderSlots(
        snapshot.val() || {}
      );

    }
  );


  onValue(
    ref(db,"novex/settings/status"),
    snapshot => {

      const value =
        snapshot.val() || "open";

      statusBadge.textContent =
        value.toUpperCase();

    }
  );


  onValue(
    ref(db,"novex/settings/miningUnlocked"),
    snapshot => {

      updateSlotSelect(
        snapshot.val() === true
      );

    }
  );


  onValue(
    ref(db,"novex/settings/announcement"),
    snapshot => {

      announcement.textContent =
        snapshot.val() ||
        "NOVEX CODM SCRIMMAGE";

    }
  );


  onValue(
    ref(db,"novex/settings/scrimTime"),
    snapshot => {

      const value =
        snapshot.val();

      if(value){

        startCountdown(value);

      }else{

        timer.textContent =
          "--:--";

      }

    }
  );


  onValue(
    ref(db,"novex/activity"),
    snapshot => {

      renderActivity(
        snapshot.val() || {}
      );

    }
  );

}


/* RENDER SLOTS */

function renderSlots(data){

  slotsDiv.innerHTML = "";

  for(let i=1;i<=25;i++){

    const team = data[i];

    const slot =
      document.createElement("div");

    slot.className = "slot";


    if(team){

      const actions =
        document.createElement("div");

      actions.className =
        "slot-actions";


      const info =
        document.createElement("div");

      info.style.flex = "1";


      const number =
        document.createElement("div");

      number.className =
        "slot-number";

      number.textContent =
        "SLOT " + i;


      const name =
        document.createElement("div");

      name.className =
        "slot-name";

      /*
        EXACT TEAM NAME
        IS DISPLAYED.
      */

      name.textContent =
        team.name;


      const handler =
        document.createElement("div");

      handler.className =
        "slot-handler";

      handler.textContent =
        team.handler;


      info.appendChild(number);
      info.appendChild(name);
      info.appendChild(handler);

      actions.appendChild(info);


      /* ADMIN REMOVE */

      if(isAdmin){

        const removeBtn =
          document.createElement("button");

        removeBtn.className =
          "remove-btn";

        removeBtn.textContent =
          "REMOVE";

        removeBtn.onclick =
          async () => {

            const confirmDelete =
              confirm(
                "Remove " +
                team.name +
                " from Slot " +
                i +
                "?"
              );

            if(!confirmDelete)
              return;


            await remove(
              ref(
                db,
                `novex/slots/${i}`
              )
            );


            await push(
              ref(db,"novex/activity"),
              {
                message:
                `${team.name} was removed from Slot ${i}.`,
                time:Date.now()
              }
            );

          };


        actions.appendChild(
          removeBtn
        );

      }


      slot.appendChild(actions);

    }else{

      slot.innerHTML = `

        <div class="slot-number">
          SLOT ${i}
        </div>

        <div class="empty-slot">
          AVAILABLE
        </div>

      `;

    }


    slotsDiv.appendChild(slot);

  }

}


/* SLOT SELECT */

function updateSlotSelect(unlocked){

  const current =
    slotSelect.value;

  slotSelect.innerHTML = `

    <option value="">
      Select an available slot
    </option>

  `;


  onValue(
    ref(db,"novex/slots"),
    snapshot => {

      const data =
        snapshot.val() || {};


      for(let i=1;i<=25;i++){

        if(!data[i] && unlocked){

          const option =
            document.createElement("option");

          option.value = i;

          option.textContent =
            "Slot " + i;

          slotSelect.appendChild(
            option
          );

        }

      }


      if(current){
        slotSelect.value =
          current;
      }

    },
    {
      onlyOnce:true
    }
  );

}


/* REGISTER */

registerBtn.onclick =
async () => {

  if(!currentUser){

    alert(
      "Please wait for Firebase to connect."
    );

    return;

  }


  const name =
    teamName.value.trim();

  const handler =
    teamHandler.value.trim();

  const contact =
    discord.value.trim();

  const logoUrl =
    logo.value.trim();

  const slot =
    slotSelect.value;


  if(!name ||
     !handler ||
     !contact ||
     !slot){

    alert(
      "Please complete all required fields."
    );

    return;

  }


  try{

    const slotRef =
      ref(
        db,
        `novex/slots/${slot}`
      );


    await set(
      slotRef,
      {

        name:name,

        handler:handler,

        discord:contact,

        logo:logoUrl,

        registeredAt:Date.now(),

        registeredBy:currentUser.uid

      }
    );


    await push(
      ref(db,"novex/activity"),
      {

        message:
        `${name} claimed Slot ${slot}.`,

        time:Date.now()

      }
    );


    alert(
      `Slot ${slot} claimed successfully!`
    );


    teamName.value = "";
    teamHandler.value = "";
    discord.value = "";
    logo.value = "";
    slotSelect.value = "";

  }catch(error){

    console.error(error);

    alert(
      "Registration failed: " +
      error.message
    );

  }

};


/* ACTIVITY */

function renderActivity(data){

  activityDiv.innerHTML = "";

  const items =
    Object.values(data)
      .sort(
        (a,b) =>
        b.time-a.time
      )
      .slice(0,30);


  if(items.length === 0){

    activityDiv.innerHTML =
      "<div>No activity yet.</div>";

    return;

  }


  items.forEach(item => {

    const div =
      document.createElement("div");

    div.className =
      "activity-item";


    const message =
      document.createElement("div");

    message.textContent =
      item.message;


    const time =
      document.createElement("div");

    time.className =
      "activity-time";

    time.textContent =
      new Date(
        item.time
      ).toLocaleString();


    div.appendChild(message);
    div.appendChild(time);

    activityDiv.appendChild(div);

  });

}


/* ADMIN LOGIN */

document.getElementById("loginBtn")
.onclick =
async () => {

  const email =
    document.getElementById(
      "adminEmail"
    ).value.trim();

  const password =
    document.getElementById(
      "adminPassword"
    ).value;


  if(!email || !password){

    loginMessage.textContent =
      "Enter email and password.";

    return;

  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginMessage.textContent =
      "Admin logged in.";

  }catch(error){

    loginMessage.textContent =
      error.message;

  }

};


/* ADMIN LOGOUT */

document.getElementById("logoutBtn")
.onclick =
async () => {

  await signOut(auth);

  await signInAnonymously(auth);

};


/* MINING */

document.getElementById("openMining")
.onclick =
async () => {

  await set(
    ref(db,"novex/settings/miningUnlocked"),
    true
  );

  await push(
    ref(db,"novex/activity"),
    {
      message:
      "Admin unlocked slot mining.",
      time:Date.now()
    }
  );

};


document.getElementById("lockMining")
.onclick =
async () => {

  await set(
    ref(db,"novex/settings/miningUnlocked"),
    false
  );

  await push(
    ref(db,"novex/activity"),
    {
      message:
      "Admin locked slot mining.",
      time:Date.now()
    }
  );

};


/* STATUS */

async function setStatus(value){

  await set(
    ref(db,"novex/settings/status"),
    value
  );

}


document.getElementById("setOpen")
.onclick =
() => setStatus("open");

document.getElementById("setRoom")
.onclick =
() => setStatus("room");

document.getElementById("setLive")
.onclick =
() => setStatus("live");

document.getElementById("setEnded")
.onclick =
() => setStatus("ended");


/* ANNOUNCEMENT */

document.getElementById(
  "saveAnnouncement"
).onclick =
async () => {

  const value =
    document.getElementById(
      "adminAnnouncement"
    ).value.trim();


  await set(
    ref(db,"novex/settings/announcement"),
    value
  );

  alert(
    "Announcement updated!"
  );

};


/* TIMER */

let timerInterval = null;


function startCountdown(endTime){

  clearInterval(
    timerInterval
  );


  function update(){

    const remaining =
      Math.max(
        0,
        endTime - Date.now()
      );


    const seconds =
      Math.floor(
        remaining / 1000
      );


    const minutes =
      Math.floor(
        seconds / 60
      );


    const secs =
      seconds % 60;


    timer.textContent =
      String(minutes).padStart(2,"0")
      + ":" +
      String(secs).padStart(2,"0");


    if(remaining <= 0){

      clearInterval(
        timerInterval
      );

      timer.textContent =
        "00:00";

    }

  }


  update();

  timerInterval =
    setInterval(
      update,
      1000
    );

}


/* START TIMER */

document.getElementById(
  "startTimer"
).onclick =
async () => {

  const seconds =
    Number(
      document.getElementById(
        "timerInput"
      ).value
    );


  if(!seconds || seconds <= 0){

    alert(
      "Enter timer seconds."
    );

    return;

  }


  const endTime =
    Date.now() +
    seconds * 1000;


  await set(
    ref(db,"novex/settings/scrimTime"),
    endTime
  );


  await push(
    ref(db,"novex/activity"),
    {
      message:
      `Admin started a ${seconds}-second timer.`,
      time:Date.now()
    }
  );

};


/* STOP TIMER */

document.getElementById(
  "stopTimer"
).onclick =
async () => {

  await set(
    ref(db,"novex/settings/scrimTime"),
    0
  );

  timer.textContent =
    "--:--";

};


/* CLEAR ALL */

document.getElementById(
  "clearSlots"
).onclick =
async () => {

  const confirmClear =
    confirm(
      "Are you sure you want to remove ALL teams?"
    );


  if(!confirmClear)
    return;


  await remove(
    ref(db,"novex/slots")
  );


  await push(
    ref(db,"novex/activity"),
    {
      message:
      "Admin cleared all slots.",
      time:Date.now()
    }
  );


  alert(
    "All slots cleared."
  );

};


/* PWA INSTALL */

let deferredPrompt = null;

const installBtn =
document.getElementById(
  "installBtn"
);


window.addEventListener(
  "beforeinstallprompt",
  event => {

    event.preventDefault();

    deferredPrompt = event;

    installBtn.style.display =
      "block";

  }
);


installBtn.onclick =
async () => {

  if(!deferredPrompt)
    return;

  deferredPrompt.prompt();

  await deferredPrompt.userChoice;

  deferredPrompt = null;

  installBtn.style.display =
    "none";

};


/* SERVICE WORKER */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker.register(
    "./service-worker.js"
  ).catch(
    error =>
    console.log(
      "Service worker:",
      error
    )
  );

}

</script>
