<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVEX CODM SCRIM</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top, #32105c 0%, #090014 42%, #030005 100%);
  color: white;
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 35px 15px 25px;
  border-bottom: 1px solid rgba(190, 90, 255, .25);
}

.logo {
  font-size: 55px;
  font-weight: 1000;
  letter-spacing: 8px;
  animation: pulse 2s infinite;
}

.logo span {
  color: #b94cff;
}

@keyframes pulse {
  0%,100% {
    text-shadow: 0 0 10px #8d2cff;
    transform: scale(1);
  }
  50% {
    text-shadow:
      0 0 15px #b94cff,
      0 0 35px #8d2cff;
    transform: scale(1.04);
  }
}

.subtitle {
  color: #cfa7ff;
  margin-top: 8px;
  font-weight: bold;
}

.container {
  width: min(1100px, 94%);
  margin: auto;
}

.card {
  background: rgba(17, 5, 30, .88);
  border: 1px solid rgba(183, 74, 255, .3);
  border-radius: 18px;
  padding: 22px;
  margin: 25px 0;
  box-shadow: 0 0 30px rgba(130, 30, 255, .12);
}

h2 {
  margin-top: 0;
  color: #d28aff;
}

.info {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}

.info div {
  background: rgba(255,255,255,.04);
  padding: 15px;
  border-radius: 12px;
  text-align: center;
}

label {
  display: block;
  margin-top: 13px;
  margin-bottom: 6px;
  color: #d9b9ff;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 13px;
  border-radius: 10px;
  border: 1px solid #66309a;
  background: #0d0614;
  color: white;
  outline: none;
}

input:focus, select:focus {
  border-color: #b94cff;
  box-shadow: 0 0 10px rgba(185,76,255,.25);
}

button {
  width: 100%;
  margin-top: 18px;
  padding: 14px;
  border: none;
  border-radius: 11px;
  background: linear-gradient(90deg, #7227c9, #b94cff);
  color: white;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.slots {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.slot {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px;
  border-radius: 12px;
  background: rgba(255,255,255,.035);
  border: 1px solid rgba(180,80,255,.18);
}

.slot-number {
  width: 38px;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #5d2096;
  border-radius: 9px;
  font-weight: 900;
}

.slot-logo {
  width: 42px;
  height: 42px;
  border-radius: 8px;
  object-fit: cover;
  background: #14091d;
}

.slot-info {
  flex: 1;
}

.slot-name {
  font-weight: 900;
}

.slot-handler {
  font-size: 12px;
  color: #bba3c9;
  margin-top: 3px;
}

.open {
  color: #b94cff;
  font-weight: bold;
}

.admin {
  display: none;
}

.status {
  text-align: center;
  padding: 10px;
  border-radius: 10px;
  margin-top: 12px;
  display: none;
}

footer {
  text-align: center;
  padding: 30px;
  color: #806a91;
  font-size: 13px;
}

@media(max-width:700px) {
  .logo {
    font-size: 38px;
    letter-spacing: 5px;
  }

  .info {
    grid-template-columns: 1fr;
  }

  .slots {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">N<span>Ø</span>VEX</div>
  <div class="subtitle">ONE SQUAD, ONE FATE</div>
</header>

<main class="container">

  <section class="card">
    <h2>🔥 NOVEX BR SCRIMMAGE</h2>

    <div class="info">
      <div>
        <b>TIME</b><br>
        8:00 PM
      </div>

      <div>
        <b>MAPS</b><br>
        ISO • BO • ISO
      </div>

      <div>
        <b>SLOTS</b><br>
        25 TEAMS
      </div>
    </div>
  </section>

  <section class="card">
    <h2>📝 TEAM REGISTRATION</h2>

    <form id="registrationForm">

      <label>Team Name</label>
      <input
        id="teamName"
        type="text"
        placeholder="Enter team name"
        required
      >

      <label>Team Handler</label>
      <input
        id="handler"
        type="text"
        placeholder="@handler"
        required
      >

      <label>Discord</label>
      <input
        id="discord"
        type="text"
        placeholder="Discord username"
        required
      >

      <label>Team Logo URL</label>
      <input
        id="logo"
        type="url"
        placeholder="https://example.com/logo.png"
      >

      <label>Select Slot</label>
      <select id="slotSelect" required>
        <option value="">Loading slots...</option>
      </select>

      <button id="registerButton" type="submit">
        REGISTER TEAM
      </button>

      <div id="status" class="status"></div>

    </form>
  </section>

  <section class="card">
    <h2>🎯 SCRIM SLOT LIST</h2>

    <div id="slots" class="slots">
      Loading slots...
    </div>
  </section>

  <section id="adminPanel" class="card admin">
    <h2>🛠️ ADMIN PANEL</h2>

    <p>
      You are logged in as the NOVEX administrator.
    </p>

    <button id="clearAll">
      CLEAR ALL SLOTS
    </button>
  </section>

</main>

<footer>
  NOVEX ESPORTS • CODM SCRIMMAGE
</footer>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue,
  set,
  remove
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyD7v0EFMI85NJk8fUCA7BsReGlVoU8WICY",
  authDomain: "novex-codm.firebaseapp.com",
  databaseURL: "https://novex-codm-default-rtdb.firebaseio.com",
  projectId: "novex-codm",
  storageBucket: "novex-codm.firebasestorage.app",
  messagingSenderId: "422875706154",
  appId: "1:422875706154:web:3f21e037173f8b51ba2453",
  measurementId: "G-9Z50JE2GFW"
};


/* =========================
   FIREBASE START
========================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getDatabase(app);


/*
 IMPORTANT:
 Replace this with your own Firebase
 administrator UID later.
*/

const ADMIN_UID = "PUT_YOUR_ADMIN_UID_HERE";


let currentUser = null;

let slotsData = {};


/* =========================
   LOGIN
========================= */

signInAnonymously(auth).catch(error => {

  console.error(error);

  showStatus(
    "Firebase login failed: " + error.message,
    true
  );

});


onAuthStateChanged(auth, user => {

  if (!user) return;

  currentUser = user;

  console.log("Firebase UID:", user.uid);

  if (user.uid === ADMIN_UID) {

    document.getElementById("adminPanel").style.display = "block";

  }

});


/* =========================
   STATUS
========================= */

function showStatus(message, error = false) {

  const status = document.getElementById("status");

  status.textContent = message;

  status.style.display = "block";

  status.style.background = error
    ? "rgba(255,50,50,.15)"
    : "rgba(170,70,255,.15)";

}


/* =========================
   LOAD 25 SLOTS
========================= */

const slotsRef = ref(db, "novex/slots");


onValue(slotsRef, snapshot => {

  slotsData = snapshot.val() || {};

  renderSlots();

  updateSlotSelector();

});


/* =========================
   RENDER SLOTS
========================= */

function renderSlots() {

  const container = document.getElementById("slots");

  container.innerHTML = "";

  for (let i = 1; i <= 25; i++) {

    const team = slotsData[i];

    const slot = document.createElement("div");

    slot.className = "slot";

    if (team) {

      slot.innerHTML = `

        <div class="slot-number">${i}</div>

        <img
          class="slot-logo"
          src="${escapeAttribute(team.logo || "")}"
          onerror="this.style.display='none'"
        >

        <div class="slot-info">

          <div class="slot-name">
            ${escapeHTML(team.name)}
          </div>

          <div class="slot-handler">
            ${escapeHTML(team.handler)}
          </div>

        </div>

      `;

      if (currentUser && currentUser.uid === ADMIN_UID) {

        const removeButton = document.createElement("button");

        removeButton.textContent = "REMOVE";

        removeButton.style.width = "auto";

        removeButton.style.margin = "0";

        removeButton.onclick = () => removeTeam(i);

        slot.appendChild(removeButton);

      }

    } else {

      slot.innerHTML = `

        <div class="slot-number">${i}</div>

        <div class="slot-info">

          <div class="slot-name open">
            OPEN SLOT
          </div>

          <div class="slot-handler">
            Available for registration
          </div>

        </div>

      `;

    }

    container.appendChild(slot);

  }

}


/* =========================
   SLOT SELECTOR
========================= */

function updateSlotSelector() {

  const select = document.getElementById("slotSelect");

  select.innerHTML =
    `<option value="">Choose an open slot</option>`;

  for (let i = 1; i <= 25; i++) {

    if (!slotsData[i]) {

      const option = document.createElement("option");

      option.value = i;

      option.textContent = `SLOT ${i} — OPEN`;

      select.appendChild(option);

    }

  }

}


/* =========================
   REGISTER TEAM
========================= */

document
  .getElementById("registrationForm")
  .addEventListener("submit", async event => {

    event.preventDefault();

    if (!currentUser) {

      showStatus(
        "Please wait for Firebase to connect.",
        true
      );

      return;

    }

    const name =
      document.getElementById("teamName").value.trim();

    const handler =
      document.getElementById("handler").value.trim();

    const discord =
      document.getElementById("discord").value.trim();

    const logo =
      document.getElementById("logo").value.trim();

    const slot =
      document.getElementById("slotSelect").value;


    if (!slot) {

      showStatus(
        "Please select an open slot.",
        true
      );

      return;

    }


    if (slotsData[slot]) {

      showStatus(
        "That slot has already been taken.",
        true
      );

      return;

    }


    const teamData = {

      name,
      handler,
      discord,
      logo,

      registeredAt: Date.now(),

      registeredBy: currentUser.uid

    };


    try {

      await set(
        ref(db, `novex/slots/${slot}`),
        teamData
      );


      showStatus(
        `SUCCESS! ${name} registered in SLOT ${slot}.`
      );


      document
        .getElementById("registrationForm")
        .reset();


    } catch (error) {

      console.error(error);

      showStatus(
        "Registration failed: " + error.message,
        true
      );

    }

  });


/* =========================
   ADMIN REMOVE
========================= */

async function removeTeam(slot) {

  if (!currentUser || currentUser.uid !== ADMIN_UID) {

    return;

  }

  if (!confirm(`Remove team from SLOT ${slot}?`)) {

    return;

  }

  await remove(
    ref(db, `novex/slots/${slot}`)
  );

}


/* =========================
   ADMIN CLEAR ALL
========================= */

document
  .getElementById("clearAll")
  .addEventListener("click", async () => {

    if (!currentUser || currentUser.uid !== ADMIN_UID) {

      return;

    }

    if (!confirm("CLEAR ALL 25 SLOTS?")) {

      return;

    }

    await remove(slotsRef);

  });


/* =========================
   SECURITY HELPERS
========================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value) {

  return escapeHTML(value);

}


</script>

</body>
</html>
